name: School Notice Bot

on:
  schedule:
    # cron 使用 UTC 時間。台灣時間 = UTC+8
    - cron: '0 0 * * *'   # 台灣時間 08:00
    - cron: '0 10 * * *'  # 台灣時間 18:00
  workflow_dispatch:  # 允許在 GitHub 網頁上手動觸發，方便測試

permissions:
  contents: write  # 需要寫入權限才能 commit 回 last_checked.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notice bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          USER_CRITERIA: ${{ secrets.USER_CRITERIA }}
        run: python main.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_checked.json
          git diff --staged --quiet || git commit -m "chore: update last_checked.json [skip ci]"
          git push
